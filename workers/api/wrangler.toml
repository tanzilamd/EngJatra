name = "engjatra-api"
main = "src/index.ts"
compatibility_date = "2026-10-09"
# Content is served by another same-zone Worker through its public origin.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
keep_vars = true
[observability]
enabled = true
head_sampling_rate = 0.1
[observability.logs]
invocation_logs = false
[vars]
ENVIRONMENT = "production"
LOCAL_DEMO = "false"
# No blank runtime bindings: direct Wrangler deploys preserve dashboard values.
# The managed deploy script injects validated production bindings and additive secrets.
