name: QA and Production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_ai:
        description: Run only two synthetic Gemma checks; never deploy or enable public AI
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: engjatra-main-production
  cancel-in-progress: false
jobs:
  qa:
    if: github.ref == 'refs/heads/main' && inputs.verify_ai != true
    runs-on: ubuntu-latest
    env:
      CHROMIUM_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa && npm run format:check && npm audit
      - run: npm run deploy:check -- --offline
      - uses: actions/upload-artifact@v4
        with:
          name: qa-proof
          path: .wrangler/qa.local.json
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qa-evidence
          path: |
            playwright-report/
            test-results/
  deploy:
    needs: qa
    if: github.ref == 'refs/heads/main' && inputs.verify_ai != true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      CONTENT_URL: ${{ vars.CONTENT_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
      GEMMA_FREE_CONFIRMED: ${{ vars.GEMMA_FREE_CONFIRMED || 'false' }}
      GEMMA_ALLOWED_COUNTRIES: ${{ vars.GEMMA_ALLOWED_COUNTRIES }}
      GEMMA_API_KEY: ${{ secrets.GEMMA_API_KEY }}
      LLAMA_MODEL: ${{ vars.LLAMA_MODEL }}
      LLAMA_FREE_CONFIRMED: ${{ vars.LLAMA_FREE_CONFIRMED || 'false' }}
      LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deploy:check -- --configuration-only
      - name: Validate Gemma metadata and eligible-only synthetic inference before publication
        run: npm run ai:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-provider-metadata
          path: .wrangler/ai-check.local.json
          include-hidden-files: true
          retention-days: 30
      - uses: actions/download-artifact@v4
        with:
          name: qa-proof
          path: .wrangler
      - name: Find previous verified static artifact
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'production-student', per_page: 100
            });
            const previous = data.artifacts.find(a => !a.expired && a.workflow_run?.head_branch === 'main');
            if (previous) core.setOutput('run_id', String(previous.workflow_run.id));
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run_id != ''
        with:
          name: production-student
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
          path: .wrangler/deployed-sites
      - run: npm run deploy:all
      - name: Install browser for real public-site verification
        run: npx playwright install --with-deps chromium
      - name: Test actual production desktop and mobile browsers
        env:
          CHROMIUM_PATH: ""
        run: npm run test:live:browser
      - name: Verify real authenticated journeys when secure QA access is bound
        env:
          CHROMIUM_PATH: ""
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run test:live:auth
      - uses: actions/upload-artifact@v4
        with:
          name: live-auth-verification
          path: .wrangler/live-auth.local.json
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: live-browser-verification
          path: .wrangler/live-browser.local.json
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: production-student
          path: apps/student-web/dist
          retention-days: 90
      - name: Archive the exact verified release for read-only monitoring
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: |
            apps/student-web/dist
            apps/admin-web/dist
            .wrangler/deployment-receipt.local.json
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-receipt
          path: .wrangler/deployment-receipt.local.json
          include-hidden-files: true
          retention-days: 90
      - name: Preserve safe gateway diagnostic (no SDK output or secrets)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployment-diagnostic
          path: .wrangler/wrangler-result.local.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve partial publication evidence for safe recovery
        uses: actions/upload-artifact@v4
        if: failure() && hashFiles('.wrangler/publication-attempt.local.json') != ''
        with:
          name: publication-attempt
          path: |
            apps/student-web/dist
            apps/admin-web/dist
            .wrangler/publication-attempt.local.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
  ai_probe:
    # Explicit reviewed commit marker permits bounded verification through
    # existing push access; routine commits never spend inference quota.
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.verify_ai == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-ai]')))
    name: Synthetic Gemma readiness (no deployment)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      GEMMA_API_KEY: ${{ secrets.GEMMA_API_KEY }}
      GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
      # Adult operator in Bangladesh confirmed. Only authored synthetic text;
      # this test-local flag neither binds a Worker nor enables public inference.
      GEMMA_FREE_CONFIRMED: "true"
      GEMMA_ALLOWED_COUNTRIES: BD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ai:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ai-readiness
          path: .wrangler/ai-check.local.json
          include-hidden-files: true
          retention-days: 30
