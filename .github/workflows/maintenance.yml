name: Read-only Production Maintenance
on:
  schedule:
    # Daily at 08:17 Asia/Dhaka; bounded Free Actions usage, no AI calls.
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # Never share production's concurrency group: that can replace its pending run.
  group: engjatra-read-only-maintenance
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      CONTENT_URL: ${{ vars.CONTENT_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select a verified release without touching active deployments
        id: release
        run: node --use-env-proxy --import tsx scripts/maintenance.ts select
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.deferred != 'true'
        with:
          name: production-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          path: .wrangler/verified-production
      - name: Verify deployed artifacts, transport and anonymous security
        id: probe
        if: steps.release.outputs.deferred != 'true'
        env:
          VERIFIED_COMMIT: ${{ steps.release.outputs.commit }}
        run: npm run monitor:check -- --artifact-root .wrangler/verified-production --expected-commit "$VERIFIED_COMMIT"
      - name: Read-only migration history and RLS audit
        if: steps.release.outputs.deferred != 'true' && steps.probe.outputs.deferred != 'true' && env.SUPABASE_ACCESS_TOKEN != ''
        run: npm run db:audit
      - name: Explain unavailable DB verification
        if: steps.release.outputs.deferred != 'true' && steps.probe.outputs.deferred != 'true' && env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning title=Database audit not configured::No project database-read connection. Website probes do not verify database migration history or full RLS."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-evidence
          path: |
            .wrangler/maintenance.local.json
            .wrangler/migrations/audit.local.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
